name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize Wiki Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Cloning source repository..."
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" source_repo

          echo "Cloning remote GitHub Wiki repository..."
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          if ! git clone "${WIKI_URL}" wiki_repo; then
            echo "::error ::Could not clone wiki repository. Please ensure 'Wikis' is enabled under repository Settings > General > Features and initialized."
            exit 1
          fi

          echo "Mirroring wiki/ contents to wiki_repo..."
          rsync -av --delete --exclude='.git' source_repo/wiki/ wiki_repo/

          cd wiki_repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "No documentation changes detected. Wiki is up to date."
            exit 0
          fi

          echo "Committing and pushing updated documentation..."
          git add -A
          git commit -m "docs(wiki): automated sync from ${{ github.sha }} [skip ci]"

          WIKI_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git push origin "${WIKI_BRANCH}"
          echo "Successfully synchronized wiki documentation!"

name: CI Tests & Validation

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Syntax Validation & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt flake8

      - name: Validate Shell Scripts Syntax
        run: |
          echo "=== Checking Shell Syntax (bash -n) ==="
          for file in modem/deploy_modem.sh \
                      modem/scripts/*.sh \
                      modem/www/cgi-bin/modem_action \
                      scripts/*.sh \
                      tests/*.sh; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              bash -n "$file"
            fi
          done

      - name: Run ShellCheck Static Analysis
        run: |
          echo "=== Running ShellCheck ==="
          shellcheck --severity=error \
            modem/deploy_modem.sh \
            modem/scripts/*.sh \
            scripts/*.sh \
            tests/*.sh

      - name: Validate Perl Scripts Syntax
        run: |
          echo "=== Checking Perl Syntax (perl -c) ==="
          for file in modem/scripts/*.pl tests/*.pl; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              perl -c "$file"
            fi
          done

      - name: Validate Python Scripts Compilation
        run: |
          echo "=== Checking Python Compilation ==="
          python3 -m py_compile server/db.py server/server_sqlite.py server/server_oracle.py modem/scripts/doAT.py

      - name: Lint Python Code with flake8
        run: |
          echo "=== Linting Python (Syntax and Runtime Fatal Errors) ==="
          flake8 server modem/scripts --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate HTML Markup Integrity
        run: |
          echo "=== Checking HTML Parsing ==="
          python3 -c "
          import html.parser, glob
          for fpath in glob.glob('modem/www/**/*.html', recursive=True):
              with open(fpath, 'r', encoding='utf-8') as f:
                  html.parser.HTMLParser().feed(f.read())
              print(f'Valid HTML: {fpath}')
          "

      - name: Run Installer Tests
        run: |
          echo "=== Running Installer Parsing Tests ==="
          bash tests/test_deploy_modem.sh

      - name: Run Telemetry Daemon & Early-Exit Tests
        run: |
          echo "=== Running Telemetry Daemon Tests ==="
          bash tests/test_telemetry_daemons.sh

      - name: Run Telemetry CLI Control Tests
        run: |
          echo "=== Running Telemetry CLI Tests ==="
          bash tests/test_telemetry_ctl.sh

      - name: Run Metrics Poller Integration Tests
        run: |
          echo "=== Running Metrics Poller Tests ==="
          perl tests/test_dashboard_telemetry.pl

      - name: Run CGI Endpoint Tests
        run: |
          echo "=== Running CGI Action Tests ==="
          bash tests/test_cgi_telemetry.sh

  docker-build-check:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Server Image (Verification)
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: fresnel-server:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
